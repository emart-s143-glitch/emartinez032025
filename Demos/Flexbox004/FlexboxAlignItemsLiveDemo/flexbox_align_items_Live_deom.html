<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Align-Items Live Demo</title>
    <style>
      #flexparent {
        width: 600px;
        height: 600px;
        background-color: peachpuff;
        margin: auto;
        display: flex;
        flex-direction: column;
        /* when flex direction is*/
        /* justify-content is horizontal*/
        /* align-items is vertical*/
        justify-content: flex-end;
        align-items: flex-start;
      }
      .flexchildren {
        width: 50px;
        height: 50px;
        background-color: lightblue;
        padding: 2rem;
        border: 3px solid black;
      }
    </style>
  </head>
  <body>
    <h1>Flexbox</h1>
    <h2>Align-Items</h2>
    <ul>
      <li>flex-end</li>
      <li>center</li>
      <li>flex-start</li>
      <li>space-between</li>
      <li>space-around</li>
      <li>space-evenly</li>
    </ul>
    <div id="container001"></div>
  </body>
</html>
