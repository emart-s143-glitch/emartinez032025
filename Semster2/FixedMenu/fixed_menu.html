<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixed Menu</title>
    <style>
/* Mobile First */
html
{
/* Temporay - delete */
height: 200%;
}
body
{
background-color: palevioletred;
margin: 0;
font-family: Arial, Helvetica, sans-serif;
}
/* Delete me
#fblogoheader
{
  background-color: pink;
  padding: 1rem;
  margin: 1rem;
} */
#pageheader
{
background-color: gray;
padding: 1rem;
/* Default */
position: static;
}

img#logo
{
width: 100px;
height: 100px;
display: block;
margin: auto;
/* margin-bottom: .5rem; */
}
#pageheader h1
{
color: plum;
text-align: center;
/* Remove color */
background-color: snow;
}
#pageheader nav
{
background-color: pink;
padding: 0.5rem;
border-radius: 10px;
}
#pageheader ul
{
background-color: palevioletred;
padding: 0.5rem;
list-style-type: none;
/* flexbox component */
display: flex;
flex-direction: column;
gap: 0.5rem;
}

#pageheader li
{
    text-align: center;
    padding: 1rem;
background-color: rgb(223, 151, 175);
border: 1px solid snow;
}
#pageheader a
{
 color: snow;
text-decoration: none;
}
/* Non pageheader items */
main
{
padding: 1rem;
}


h2
{
    color: snow;
}

p
{
    line-height: 1.5;
    color: #333;
}
/* Tablet and Desktop CSS */
@media screen and (min-width: 650px) 
{
body
{
background-color: peachpuff;

}
#pageheader
{
position: fixed;
top: 0;
left:0;
right:0;
/* Flexbox component */
display: flex;
justify-content: space-between;
align-items: center;
}
#fblogoheader
{
/* lexbox component */
display: flex;
align-items: center;
gap: 1rem;
}
#pageheader nav
{
min-width: 400px;
}
#pageheader ul
{
flex-direction: row;
justify-content: center;
}
main
{
padding-top: 200px;

}
}

    </style>
  </head>
  <body>
    <header id="pageheader">
      <!-- Start the logo and header -->

      <div id="fblogoheader">
        <img id="logo" src="Images/paws_logo.png" alt="Paws Logo" />
        <h1>Paws and Whiskers</h1>
      </div>
      <!-- End the logo and header -->
<!-- Start the navigation -->
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Our pets</a></li>
          <li><a href="#">Testimonials</a></li>
          <li><a href="#">About Us</a></li>
        </ul>
      </nav>
      <!-- End the navigation -->
    </header>
    <main>
        <h2>Fixed Menu</h2>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
        </p>
    </main>
  </body>
</html>
